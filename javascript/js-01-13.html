   <div class="card">
    <h2>
     Write a program to sort an array.
    </h2>
    <p>
     Working JavaScript practical program. Try the controls below.
    </p>
   </div>
   <div class="card">
    <label>
     Array
    </label>
    <input id="v" value="5"/>
    <button onclick="run()">
     Sort
    </button>
    <div class="result" id="out">
    </div>
    <script>
     function run(){out.textContent=v.value.split(',').map(x=>+x).sort((a,b)=>a-b).join(', ')}
    </script>
   </div>
