   <div class="card">
    <input id="n" type="number" value="10"/>
    <button onclick="start()">
     Start
    </button>
    <h2 id="out">
     Ready
    </h2>
    <script>
     let timer;function start(){clearInterval(timer);let x=+n.value;out.textContent=x;timer=setInterval(()=>{x--;out.textContent=x;if(x<=0){clearInterval(timer);out.textContent='Time up!'}},1000)}
    </script>
