<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create a stopwatch.</title><link href="../assets/style.css" rel="stylesheet"></head><body><header class="top"><h1>HTML CSS JavaScript Practical Programs</h1><div>Programs • Create a stopwatch.</div></header><nav class="nav"><a class="btn" href="../index.html">Home</a><a class="btn" href="../html/index.html">HTML</a><a class="btn" href="../css/index.html">CSS</a><a class="btn" href="../javascript/index.html">JavaScript</a></nav><main class="wrap"><a class="btn" href="index.html">← Back to Programs</a><div class="card"><h2>Create a stopwatch.</h2><p>Working JavaScript practical program. Try the controls below.</p></div><div class="card"><button onclick="start()">Start</button><button onclick="stop()">Stop</button><div class="result" id="out">0 s</div><script>let id,s;function start(){s=Date.now();id=setInterval(()=>out.textContent=((Date.now()-s)/1000).toFixed(1)+" s",100)}function stop(){clearInterval(id)}</script></div><div class="program-buttons"><a class="btn" href="js-09-02.html">← Back</a><a class="btn" href="js-09-04.html">Next →</a></div></main><footer class="footer">Practical Programs Website</footer></body></html>
