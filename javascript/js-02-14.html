   <div class="card">
    <h2>
     Create a stopwatch using JavaScript.
    </h2>
    <p>
     Working JavaScript practical program. Try the controls below.
    </p>
   </div>
   <div class="card">
    <h2 id="sw">
     0.0 s
    </h2>
    <button onclick="start()">
     Start
    </button>
    <button onclick="stop()">
     Stop
    </button>
    <button onclick="reset()">
     Reset
    </button>
    <script>
     let sec=0,timer;function start(){if(!timer)timer=setInterval(()=>{sec+=.1;sw.textContent=sec.toFixed(1)+' s'},100)}function stop(){clearInterval(timer);timer=null}function reset(){stop();sec=0;sw.textContent='0.0 s'}
    </script>
   </div>
