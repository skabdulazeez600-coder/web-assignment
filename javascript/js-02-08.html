   <div class="card">
    <h2>
     Create a number guessing game.
    </h2>
    <p>
     Working JavaScript practical program. Try the controls below.
    </p>
   </div>
   <div class="card">
    <input id="g" max="10" min="1" type="number" value="5"/>
    <button onclick="guess()">
     Guess
    </button>
    <div class="result" id="out">
    </div>
    <script>
     let secret=7;function guess(){let x=+g.value;out.textContent=x===secret?'Correct!':x<secret?'Too low':'Too high'}
    </script>
   </div>
