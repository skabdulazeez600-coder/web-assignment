<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create a countdown timer.</title><link href="../assets/style.css" rel="stylesheet"></head><body><header class="top"><h1>HTML CSS JavaScript Practical Programs</h1><div>Programs • Create a countdown timer.</div></header><nav class="nav"><a class="btn" href="../index.html">Home</a><a class="btn" href="../html/index.html">HTML</a><a class="btn" href="../css/index.html">CSS</a><a class="btn" href="../javascript/index.html">JavaScript</a></nav><main class="wrap"><a class="btn" href="index.html">← Back to Programs</a><div class="card"><h2>Create a countdown timer.</h2><p>Working JavaScript practical program. Try the controls below.</p></div><div class="card"><input id="n" type="number" value="10"><button onclick="go()">Start</button><div class="result" id="out"></div><script>function go(){let x=+n.value;clearInterval(window.c);out.textContent=x;window.c=setInterval(()=>{out.textContent=--x;if(x<=0)clearInterval(window.c)},1000)}</script></div><div class="program-buttons"><a class="btn" href="js-09-03.html">← Back</a><a class="btn" href="js-09-05.html">Next →</a></div></main><footer class="footer">Practical Programs Website</footer></body></html>
