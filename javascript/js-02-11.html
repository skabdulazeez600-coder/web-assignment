   <div class="card">
    <h2>
     Create a to-do list using JavaScript.
    </h2>
    <p>
     Working JavaScript practical program. Try the controls below.
    </p>
   </div>
   <div class="card">
    <input id="task" placeholder="Enter task"/>
    <button onclick="addTask()">
     Add
    </button>
    <ul id="list">
    </ul>
    <script>
     function addTask(){if(!task.value.trim())return;let li=document.createElement('li');li.textContent=task.value;li.onclick=()=>li.remove();list.appendChild(li);task.value=''}
    </script>
   </div>
